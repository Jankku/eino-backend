openapi: 3.0.0
info:
  title: Eino
  description: Eino API docs
  version: 1.2.0
  license:
    name: MIT
    url: https://github.com/Jankku/eino-backend/blob/master/LICENSE.md
externalDocs:
  url: https://github.com/Jankku/eino-backend/
servers:
  - url: https://eino.jankku.fi/api/{version}
    variables:
      version:
        default: v1
    description: Production server
  - url: http://localhost:5000/api/{version}
    variables:
      version:
        default: v1
    description: Localhost
tags:
  - name: docs
    description: Docs endpoints
  - name: auth
    description: Auth endpoints
  - name: books
    description: Book endpoints
  - name: movies
    description: Movie endpoints
  - name: profile
    description: Profile endpoints
  - name: share
    description: Public profile share endpoints
paths:
  /docs.json:
    get:
      tags:
        - docs
      summary: Get API docs as JSON
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {}
  /auth/register:
    post:
      tags:
        - auth
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  $ref: '#/components/schemas/Username'
                password:
                  $ref: '#/components/schemas/Password'
                password2:
                  $ref: '#/components/schemas/Password'
                email:
                  $ref: '#/components/schemas/OptionalEmail'
              required:
                - username
                - password
                - password2
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags:
        - auth
      summary: Login user
      description: >-
        The username field accepts a username or verified email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                required:
                  - accessToken
                  - refreshToken
        '422':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refreshtoken:
    post:
      tags:
        - auth
      summary: Get new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                required:
                  - accessToken
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: JWT error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/passwordstrength:
    post:
      tags:
        - auth
      summary: Check password strength
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
                - password
      responses:
        '200':
          description: Password strength check successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordStrength'
        '500':
          description: Password strength check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /profile:
    get:
      tags:
        - profile
      summary: Get user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/share:
    get:
      tags:
        - profile
      summary: Share user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        share_id:
                          type: string
                      required:
                        - share_id
                required:
                  - results
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/export:
    post:
      tags:
        - profile
      summary: Export profile data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  $ref: '#/components/schemas/Password'
                includeAuditLog:
                  type: boolean
                  description:
                    Include the requesting user's audit entries. Omitted or false returns an empty audits
                    array.
              required:
                - password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/deleteaccount:
    post:
      tags:
        - profile
      summary: Delete user account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  $ref: '#/components/schemas/Password'
                twoFactorCode:
                  $ref: '#/components/schemas/OptionalTwoFactorCode'
              required:
                - password
      responses:
        '200':
          description: Account successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/books/count:
    get:
      tags:
        - books
      summary: Get book count by status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileBookCount'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /list/books/{status}:
    get:
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
            enum: [all, completed, reading, on-hold, dropped, planned]
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                title,
                author,
                publisher,
                pages,
                year,
                status,
                score,
                start_date,
                end_date,
                created_on,
              ]
            default: title
        - name: order
          in: query
          schema:
            type: string
            enum: [ascending, descending]
            default: ascending
        - name: filter
          in: query
          schema:
            type: string
          description:
            key:operator:value, e.g. 'score:>:5', 'title:=:1984', 'start_date:>:2025-01-01',
            'created_on:<:2026-01-01T12:30:00Z'. Text fields support equality; numbers and dates
            support =, >, <. Date-only values compare calendar days; ISO timestamps compare
            instants.
      tags:
        - books
      summary: Get books by status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /list/books/book/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      tags:
        - books
      summary: Get book by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /list/books/search:
    get:
      tags:
        - books
      summary: Search books
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/books/images:
    get:
      tags:
        - books
      summary: Get book covers
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/books/add:
    post:
      tags:
        - books
      summary: Add new book to the list
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBookRequest'
      responses:
        '201':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: Invalid request body or per-user list item quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/books/update/{id}:
    put:
      tags:
        - books
      summary: Update an existing book
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBookRequest'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/books/delete/{id}:
    delete:
      tags:
        - books
      summary: Delete book
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/movies/count:
    get:
      tags:
        - movies
      summary: Get movie count by status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileMovieCount'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /list/movies/{status}:
    get:
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
            enum: [all, completed, watching, on-hold, dropped, planned]
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                title,
                studio,
                director,
                writer,
                duration,
                year,
                status,
                score,
                start_date,
                end_date,
                created_on,
              ]
            default: title
        - name: order
          in: query
          schema:
            type: string
            enum: [ascending, descending]
            default: ascending
        - name: filter
          in: query
          schema:
            type: string
          description:
            key:operator:value, e.g. 'score:>:5', 'title:=:1984', 'start_date:>:2025-01-01',
            'created_on:<:2026-01-01T12:30:00Z'. Text fields support equality; numbers and dates
            support =, >, <. Date-only values compare calendar days; ISO timestamps compare
            instants.
      tags:
        - movies
      summary: Get movies by status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /list/movies/movie/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      tags:
        - movies
      summary: Get movie by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /list/movies/search:
    get:
      tags:
        - movies
      summary: Search movies
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/movies/images:
    get:
      tags:
        - movies
      summary: Get movie posters
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/movies/add:
    post:
      tags:
        - movies
      summary: Add new movie to the list
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMovieRequest'
      responses:
        '201':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: Invalid request body or per-user list item quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/movies/update/{id}:
    put:
      tags:
        - movies
      summary: Update an existing movie
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMovieRequest'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/movies/delete/{id}:
    delete:
      tags:
        - movies
      summary: Delete movie
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Movie deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /share/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      tags:
        - share
      summary: Get shared image by ID
      responses:
        '200':
          description: Successful response
          content:
            image/png:
              schema:
                type: string
                format: binary
        '500':
          $ref: '#/components/responses/InternalServerError'
        '422':
          description: Invalid share ID or share image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/login/config:
    post:
      tags:
        - auth
      summary: Get login config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  $ref: '#/components/schemas/Username'
                password:
                  $ref: '#/components/schemas/Password'
              required:
                - username
                - password
      responses:
        '200':
          description: Login configuration
          content:
            application/json:
              schema:
                type: object
                required:
                  - is2FAEnabled
                properties:
                  is2FAEnabled:
                    type: boolean
        '422':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password/forgot:
    post:
      tags:
        - auth
      summary: Send reset password email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  $ref: '#/components/schemas/Email'
              required:
                - email
      responses:
        '200':
          description: Reset password email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '424':
          description: Email delivery failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Failed to send reset password email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/password/reset:
    post:
      tags:
        - auth
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          description: Failed to reset password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/2fa/generate:
    post:
      tags:
        - auth
      summary: Generate TOTP and QR code
      security:
        - BearerAuth: []
      responses:
        '200':
          description: TOTP url and QR code data URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorGenerateRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/2fa/enable:
    post:
      tags:
        - auth
      summary: Enable two-factor verification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - twoFactorCode
              properties:
                twoFactorCode:
                  $ref: '#/components/schemas/OTP'
      responses:
        '200':
          description: Two-factor authentication enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/2fa/disable:
    post:
      tags:
        - auth
      summary: Disable two-factor verification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - twoFactorCode
              properties:
                twoFactorCode:
                  $ref: '#/components/schemas/OTP'
      responses:
        '200':
          description: Two-factor authentication disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /list/books/search/isbn/{isbn}:
    get:
      tags:
        - books
      summary: Look up book metadata by ISBN
      security:
        - BearerAuth: []
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
          example: 978-0-14-103614-4
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookLookupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Invalid ISBN or lookup failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
