openapi: 3.0.0
info:
  title: Eino
  description: Eino API docs
  version: 2.5.0
  license:
    name: MIT
    url: https://github.com/Jankku/eino-backend/blob/master/LICENSE.md
externalDocs:
  url: https://github.com/Jankku/eino-backend/
servers:
  - url: https://eino.jankku.fi/api/{version}
    variables:
      version:
        default: v2
    description: Production server
  - url: http://localhost:5000/api/{version}
    variables:
      version:
        default: v2
    description: Localhost
tags:
  - name: docs
    description: Documentation endpoints
  - name: admin
    description: Admin endpoints
  - name: auth
    description: Authentication endpoints
  - name: email
    description: Email endpoints
  - name: books
    description: Book endpoints
  - name: movies
    description: Movie endpoints
  - name: profile
    description: Profile endpoints
  - name: share
    description: Public profile share endpoints
  - name: profilepicture
    description: Public profile picture endpoints
  - name: bulletins
    description: Bulletin endpoints
paths:
  /docs.json:
    get:
      tags:
        - docs
      summary: Get API docs as JSON
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {}
  /admin/audits:
    get:
      tags:
        - admin
      summary: Get all audit log entries
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: Requires an enabled account with the admin role.
  /admin/users:
    get:
      tags:
        - admin
      summary: Get all users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: Requires an enabled account with the admin role.
  /admin/users/{id}/enable:
    post:
      summary: Enable user account
      security:
        - BearerAuth: []
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{id}/disable:
    post:
      summary: Disable user account
      security:
        - BearerAuth: []
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{id}:
    put:
      summary: Edit user information
      security:
        - BearerAuth: []
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditUserRequest'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete user account
      security:
        - BearerAuth: []
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/register:
    post:
      tags:
        - auth
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  $ref: '#/components/schemas/Username'
                password:
                  $ref: '#/components/schemas/Password'
                password2:
                  $ref: '#/components/schemas/Password'
                email:
                  $ref: '#/components/schemas/OptionalEmail'
              required:
                - username
                - password
                - password2
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags:
        - auth
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                required:
                  - accessToken
                  - refreshToken
        '422':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login/config:
    post:
      tags:
        - auth
      summary: Get login config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  $ref: '#/components/schemas/Username'
                password:
                  $ref: '#/components/schemas/Password'
              required:
                - username
                - password
      responses:
        '200':
          description: Login configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  is2FAEnabled:
                    type: boolean
                required:
                  - is2FAEnabled
        '422':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refreshtoken:
    post:
      tags:
        - auth
      summary: Get new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                required:
                  - accessToken
        '422':
          description: JWT error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/passwordstrength:
    post:
      tags:
        - auth
      summary: Check password strength
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
                - password
      responses:
        '200':
          description: Password strength check successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordStrength'
        '500':
          description: Password strength check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password/forgot:
    post:
      tags:
        - auth
      summary: Send reset password email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  $ref: '#/components/schemas/Email'
              required:
                - email
      responses:
        '200':
          description: Reset password email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '500':
          description: Failed to send reset password email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '424':
          description: Email delivery failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/password/reset:
    post:
      tags:
        - auth
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '500':
          description: Failed to reset password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/2fa/generate:
    post:
      tags:
        - auth
      summary: Generate TOTP and QR code
      security:
        - BearerAuth: []
      responses:
        '200':
          description: TOTP url and QR code data URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorGenerateRequest'
        '500':
          description: Failed to generate TOTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/2fa/enable:
    post:
      tags:
        - auth
      summary: Enable two-factor verification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                twoFactorCode:
                  $ref: '#/components/schemas/OTP'
              required:
                - twoFactorCode
      responses:
        '200':
          description: Two-factor authentication enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '500':
          description: Failed to enable Two-factor authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/2fa/disable:
    post:
      tags:
        - auth
      summary: Disable two-factor verification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                twoFactorCode:
                  $ref: '#/components/schemas/OTP'
              required:
                - twoFactorCode
      responses:
        '200':
          description: Two-factor authentication disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '500':
          description: Failed to disable two-factor authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /email/update:
    post:
      tags:
        - email
      summary: Update email
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  $ref: '#/components/schemas/OptionalEmail'
                twoFactorCode:
                  $ref: '#/components/schemas/OptionalTwoFactorCode'
      responses:
        '200':
          description: Email updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: Failed to update email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /email/sendconfirmation:
    post:
      tags:
        - email
      summary: Send an confirmation email. Used to verify email
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Confirmation email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: Failed to send confirmation email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '424':
          description: Email delivery failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /email/verify:
    post:
      tags:
        - email
      summary: Verify email using one-time password (OTP) sent to email
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: Failed to verify email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  $ref: '#/components/schemas/OTP'
  /profile:
    get:
      tags:
        - profile
      summary: Get user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/share:
    get:
      tags:
        - profile
      summary: Share user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        share_id:
                          type: string
                      required:
                        - share_id
                required:
                  - results
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/profilepicture:
    post:
      tags:
        - profile
      summary: Upload profile picture
      description: >-
        Requires a non-empty picture file. Missing or empty uploads are rejected without changing
        the current picture. Use DELETE to remove it.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [picture]
              additionalProperties: false
              properties:
                picture:
                  type: string
                  format: binary
            encoding:
              picture:
                contentType: image/*
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: Invalid image, multipart upload, or upload limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Profile picture upload capacity is full; retry later
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - profile
      summary: Delete profile picture
      description: Removes the current profile picture. Safe to repeat when no picture is set.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile picture removed, or no picture was set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '500':
          description: Could not remove profile picture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /profile/export:
    post:
      tags:
        - profile
      summary: Export profile data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  $ref: '#/components/schemas/Password'
                includeAuditLog:
                  type: boolean
              required:
                - password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/import:
    post:
      tags:
        - profile
      summary: Import profile data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportProfileRequest'
      responses:
        '200':
          description: Profile imported successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: Item count exceeds the limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/deleteaccount:
    post:
      tags:
        - profile
      summary: Delete user account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  $ref: '#/components/schemas/Password'
                twoFactorCode:
                  $ref: '#/components/schemas/OptionalTwoFactorCode'
              required:
                - password
      responses:
        '200':
          description: Account successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '422':
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /list/books/count:
    get:
      tags:
        - books
      summary: Get book count by status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileBookCount'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /list/books/{status}:
    get:
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
            enum: [all, completed, reading, on-hold, dropped, planned]
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                title,
                author,
                publisher,
                pages,
                year,
                status,
                score,
                start_date,
                end_date,
                created_on,
              ]
            default: title
        - name: order
          in: query
          schema:
            type: string
            enum: [ascending, descending]
            default: ascending
        - name: filter
          in: query
          schema:
            type: string
          description:
            key:operator:value, e.g. 'score:>:5', 'title:=:1984', 'start_date:>:2025-01-01',
            'created_on:<:2026-01-01T12:30:00Z'. Text fields support equality; numbers and dates
            support =, >, <. Date-only values compare calendar days; ISO timestamps compare
            instants.
      tags:
        - books
      summary: Get books by status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /list/books/book/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      tags:
        - books
      summary: Get book by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
