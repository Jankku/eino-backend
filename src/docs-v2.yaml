components:
  schemas:
    Username:
      type: string
      minLength: 3
      maxLength: 255
    Password:
      type: string
      minLength: 8
    Login:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        twoFactorCode:
          $ref: '#/components/schemas/OptionalTwoFactorCode'
      required:
        - username
        - password
    ResetPassword:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
        newPassword:
          $ref: '#/components/schemas/Password'
        otp:
          $ref: '#/components/schemas/OTP'
        twoFactorCode:
          $ref: '#/components/schemas/OptionalTwoFactorCode'
      required:
        - email
        - newPassword
        - otp
    TwoFactorGenerateRequest:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              totpUrl:
                type: string
              qrCodeUrl:
                type: string
            required:
              - totpUrl
              - qrCodeUrl
    AddBookRequest:
      type: object
      required:
        - isbn
        - title
        - author
        - publisher
        - pages
        - year
        - status
        - score
        - start_date
        - end_date
      properties:
        isbn:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        publisher:
          type: string
          maxLength: 255
        image_url:
          $ref: '#/components/schemas/CoverUrl'
        pages:
          type: number
          minimum: 0
        year:
          type: number
          minimum: 0
        status:
          type: string
          enum: [completed, reading, on-hold, dropped, planned]
        score:
          type: number
          minimum: 0
          maximum: 10
        start_date:
          type: string
          example: 2026-10-29T12:00:00Z
        end_date:
          type: string
          example: 2026-10-29T12:00:00Z
        note:
          type: string
          nullable: true
        language_code:
          $ref: '#/components/schemas/LanguageCode'
    AddMovieRequest:
      type: object
      required:
        - title
        - studio
