events {}

http {
    server {
        include /etc/nginx/mime.types;
        server_name eino.jankku.fi;
        access_log off;
        server_tokens off;
        root /usr/share/nginx/html;

        client_max_body_size 11m;

        listen [::]:443 ssl;
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/letsencrypt/live/jankku.fi/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jankku.fi/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' analytics.jankku.fi 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; connect-src 'self' analytics.jankku.fi;" always;
        add_header Permissions-Policy "accelerometer=(),autoplay=(),camera=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),midi=(),payment=(),usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;

        brotli_static on;
        brotli_types
            text/css
            application/javascript
            application/json;

        location / {
            index index.html;
            try_files $uri /index.html;
        }

        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        location = /assets {
            return 308 /assets/$is_args$args;
        }

        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' analytics.jankku.fi 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; connect-src 'self' analytics.jankku.fi;" always;
            add_header Permissions-Policy "accelerometer=(),autoplay=(),camera=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),midi=(),payment=(),usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Origin-Agent-Cluster "?1" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "0" always;
            try_files $uri =404;
        }

        location = /api {
            return 308 /api/$is_args$args;
        }

        location ^~ /api/ {
            proxy_pass http://app:5000;
            proxy_redirect off;
            proxy_intercept_errors on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }
    }
}
